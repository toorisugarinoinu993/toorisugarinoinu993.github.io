<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>はじめてのWebサイト</title>

  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #f4f7fb;
      color: #222;
    }

    header {
      background: rgb(0,0,250);
      color: rgb(250,0,0);
      padding: 50px 20px;
      text-align: center;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    section {
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1d4ed8;
    }
  </style>
</head>

<body>
  <header>
    <h1>はじめてのWebサイト</h1>
    <p>Web制作を始めました。</p>
  </header>

  <main>
    <section>
      <h2>自己紹介</h2>
      <p>
        このサイトでは、制作物や勉強した内容を紹介します。
      </p>

      <button onclick="showMessage()">クリックしてください</button>

      <p id="message"></p>
    </section>
  </main>

  <script>
    function showMessage() {
      document.getElementById("message").textContent =
        "JavaScriptが動きました！";
    }
  </script>
</body>
</html>
